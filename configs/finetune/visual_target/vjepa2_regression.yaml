# LIBERO fine-tuning of configs/pretrain/visual_target/vjepa2_regression.yaml.
# The generation expert is transferred, so its settings match pre-training exactly.
_base_: [../libero.yaml]

run_id: finetune_target_vjepa2_regression

framework:
  gen_model:
    mode: regression
    normalize_target: true # regression targets are standardized
    targets:
      - target:
          type: vjepa
          path: playground/Pretrained_models/vjepa2-vitg-fpc64-256
          pool: none
        decoder: {type: mlp, num_layers: 3}
        loss: {type: mse}
        num_gen_queries: auto

datasets:
  total_per_device_batch_size: 32

trainer:
  pretrained_checkpoint: playground/Checkpoints/pretrain_target_vjepa2_regression/checkpoints/steps_20000_pytorch_model.pt
