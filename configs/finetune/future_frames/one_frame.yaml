# LIBERO fine-tuning of configs/pretrain/future_frames/one_frame.yaml (one future frame at the end of the action chunk).
_base_: [../libero.yaml]

run_id: finetune_frames_one_frame

framework:
  gen_model:
    mode: diffusion
    num_future_frames: 1
    normalize_target: false
    targets:
      - target:
          type: siglip
          path: playground/Pretrained_models/siglip2-so400m-patch16-256
          resolution: 256
          pool: none
        loss:
          type: flow_matching
          timestep_schedule: auto
        num_gen_queries: auto

datasets:
  total_per_device_batch_size: 32

trainer:
  pretrained_checkpoint: playground/Checkpoints/pretrain_frames_one_frame/checkpoints/steps_20000_pytorch_model.pt
