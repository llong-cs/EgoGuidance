# LIBERO fine-tuning of configs/pretrain/visual_target/lingbot_diffusion.yaml.
# The generation expert is transferred, so its settings match pre-training exactly.
_base_: [../libero.yaml]

run_id: finetune_target_lingbot_diffusion

framework:
  gen_model:
    mode: diffusion
    normalize_target: false
    targets:
      - target:
          type: lingbot
          variant: giant
          path: playground/Pretrained_models/lingbot-vision-vit-giant
          resolution: 512
        loss:
          type: flow_matching
          timestep_schedule: auto
        num_gen_queries: auto

datasets:
  total_per_device_batch_size: 16

trainer:
  pretrained_checkpoint: playground/Checkpoints/pretrain_target_lingbot_diffusion/checkpoints/steps_20000_pytorch_model.pt
