# LIBERO fine-tuning of configs/pretrain/visual_target/qwenvit_diffusion.yaml.
# The generation expert is transferred, so its settings match pre-training exactly.
_base_: [../libero.yaml]

run_id: finetune_target_qwenvit_diffusion

framework:
  gen_model:
    mode: diffusion
    normalize_target: false
    targets:
      - target:
          type: auto
          resolution: 224
          pool: none
        loss:
          type: flow_matching
          timestep_schedule: auto
        num_gen_queries: auto

datasets:
  total_per_device_batch_size: 32

trainer:
  pretrained_checkpoint: playground/Checkpoints/pretrain_target_qwenvit_diffusion/checkpoints/steps_20000_pytorch_model.pt
