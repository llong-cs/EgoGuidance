# Visual-target study: LingBot-Vision ViT-g/16, flow matching.
# DROID + Open-AoE co-training; only the generation target / objective changes.
_base_: [../cotrain_openaoe.yaml]

run_id: pretrain_target_lingbot_diffusion

framework:
  gen_model:
    mode: diffusion
    normalize_target: false
    targets:
      - target:
          type: lingbot
          variant: giant
          path: playground/Pretrained_models/lingbot-vision-vit-giant
          resolution: 512
        loss:
          type: flow_matching
          timestep_schedule: auto
        num_gen_queries: auto

datasets:
  total_per_device_batch_size: 16
