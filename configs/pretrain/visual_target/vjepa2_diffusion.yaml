# Visual-target study: V-JEPA2 ViT-g/16 (the future frame is repeated to fill one tubelet), flow matching.
# DROID + Open-AoE co-training; only the generation target / objective changes.
_base_: [../cotrain_openaoe.yaml]

run_id: pretrain_target_vjepa2_diffusion

framework:
  gen_model:
    mode: diffusion
    normalize_target: false
    targets:
      - target:
          type: vjepa
          path: playground/Pretrained_models/vjepa2-vitg-fpc64-256
          pool: none
        loss:
          type: flow_matching
          timestep_schedule: auto
        num_gen_queries: auto
