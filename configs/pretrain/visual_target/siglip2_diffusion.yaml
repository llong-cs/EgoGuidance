# Visual-target study: SigLIP2 So400m/16, flow matching.
# DROID + Open-AoE co-training; only the generation target / objective changes.
_base_: [../cotrain_openaoe.yaml]

run_id: pretrain_target_siglip2_diffusion

framework:
  gen_model:
    mode: diffusion
    normalize_target: false
    targets:
      - target:
          type: siglip
          path: playground/Pretrained_models/siglip2-so400m-patch16-256
          resolution: 256
          pool: none
        loss:
          type: flow_matching
          timestep_schedule: auto
        num_gen_queries: auto
