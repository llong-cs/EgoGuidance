# Visual-target study: DINOv2 ViT-g/14, regression (standardized target, MSE).
# DROID + Open-AoE co-training; only the generation target / objective changes.
_base_: [../cotrain_openaoe.yaml]

run_id: pretrain_target_dinov2_regression

framework:
  gen_model:
    mode: regression
    normalize_target: true # regression targets are standardized
    targets:
      - target:
          type: dino
          path: playground/Pretrained_models/dinov2-giant
        decoder: {type: mlp, num_layers: 3}
        loss: {type: mse}
        num_gen_queries: auto
