# Visual-target study: Wan2.2 VAE latent, flow matching.
# DROID + Open-AoE co-training; only the generation target / objective changes.
_base_: [../cotrain_openaoe.yaml]

run_id: pretrain_target_wan_vae_diffusion

framework:
  gen_model:
    mode: diffusion
    normalize_target: false
    targets:
      - target:
          type: wan_vae
          path: playground/Pretrained_models/Wan2.2-TI2V-5B-Diffusers
          vae_subfolder: vae
          resolution: 256
          pool: none
        loss:
          type: flow_matching
          timestep_schedule: auto
        num_gen_queries: auto
