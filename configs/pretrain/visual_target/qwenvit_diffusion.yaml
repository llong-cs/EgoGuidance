# Visual-target study: Qwen-ViT (the VLM's own frozen vision encoder), flow matching.
# DROID + Open-AoE co-training; only the generation target / objective changes.
_base_: [../cotrain_openaoe.yaml]

run_id: pretrain_target_qwenvit_diffusion

framework:
  gen_model:
    mode: diffusion
    normalize_target: false
    targets:
      - target:
          type: auto
          resolution: 224
          pool: none
        loss:
          type: flow_matching
          timestep_schedule: auto
        num_gen_queries: auto
