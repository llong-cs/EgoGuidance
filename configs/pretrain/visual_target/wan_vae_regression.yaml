# Visual-target study: Wan2.2 VAE latent, regression (standardized target, MSE).
# DROID + Open-AoE co-training; only the generation target / objective changes.
_base_: [../cotrain_openaoe.yaml]

run_id: pretrain_target_wan_vae_regression

framework:
  gen_model:
    mode: regression
    normalize_target: true # regression targets are standardized
    targets:
      - target:
          type: wan_vae
          path: playground/Pretrained_models/Wan2.2-TI2V-5B-Diffusers
          vae_subfolder: vae
          resolution: 256
          pool: none
        decoder: {type: mlp, num_layers: 3}
        loss: {type: mse}
        num_gen_queries: auto
